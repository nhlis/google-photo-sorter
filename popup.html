<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <title>GPhotos Sorter</title>
        <style>
            :root {
                --bg: #ffffff;
                --fg: #202124;
                --muted: #5f6368;
                --line: #e3e5e8;
                --surface: #f1f3f4;
                --primary: #1a73e8;
                --ok: #188038;
                --err: #c5221f;
                --coffee: #ffdd00;
                --coffee-fg: #202124;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #202124;
                    --fg: #e8eaed;
                    --muted: #9aa0a6;
                    --line: #3c4043;
                    --surface: #2d2e31;
                    --primary: #8ab4f8;
                    --ok: #81c995;
                    --err: #f28b82;
                }
            }
            * {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            body {
                width: 380px;
                height: 500px;
                margin: 0;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                background: var(--bg);
                color: var(--fg);
                font:
                    13px/1.45 'Google Sans',
                    'Roboto',
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
            }
            header {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            h1 {
                margin: 0;
                font-size: 15px;
                font-weight: 600;
            }
            .pill {
                margin-left: auto;
                padding: 3px 10px;
                border-radius: 999px;
                background: var(--surface);
                color: var(--muted);
                font-size: 12px;
                font-weight: 500;
            }

            main {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding-right: 2px;
            }

            /* Công tắc: checkbox thật vẫn nhận focus/bàn phím nhưng được ẩn đi; .sw là hình công tắc vẽ bằng CSS */
            .setting {
                position: relative;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 12px;
                border-radius: 12px;
                background: var(--surface);
                cursor: pointer;
            }
            .setting-text {
                flex: 1;
                font-weight: 500;
            }
            .setting input {
                position: absolute;
                opacity: 0;
                width: 1px;
                height: 1px;
                margin: 0;
            }
            .sw {
                position: relative;
                flex: none;
                width: 36px;
                height: 20px;
                border-radius: 999px;
                box-shadow: inset 0 0 0 2px var(--muted);
                transition:
                    background 0.15s,
                    box-shadow 0.15s;
            }
            .sw::after {
                content: '';
                position: absolute;
                top: 5px;
                left: 5px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--muted);
                transition:
                    transform 0.15s,
                    width 0.15s,
                    height 0.15s,
                    top 0.15s,
                    left 0.15s,
                    background 0.15s;
            }
            input:checked + .sw {
                background: var(--primary);
                box-shadow: none;
            }
            input:checked + .sw::after {
                top: 3px;
                left: 3px;
                width: 14px;
                height: 14px;
                background: var(--bg);
                transform: translateX(16px);
            }
            input:focus-visible + .sw {
                outline: 2px solid var(--primary);
                outline-offset: 2px;
            }
            @media (prefers-reduced-motion: reduce) {
                .sw,
                .sw::after {
                    transition: none;
                }
            }

            .tabs {
                display: flex;
                border-bottom: 1px solid var(--line);
            }
            .tab {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 8px 6px;
                margin-bottom: -1px;
                border: 0;
                border-bottom: 2px solid transparent;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-weight: 500;
                cursor: pointer;
            }
            .tab:hover {
                color: var(--fg);
            }
            .tab[aria-selected='true'] {
                color: var(--primary);
                border-bottom-color: var(--primary);
            }
            .badge {
                min-width: 18px;
                padding: 0 6px;
                border-radius: 999px;
                text-align: center;
                background: var(--surface);
                color: var(--muted);
                font-size: 11px;
                line-height: 18px;
            }
            .badge.err {
                background: var(--err);
                color: var(--bg);
            } /* tab Lỗi bị ẩn sau tab khác nên cần dấu hiệu nổi bật */
            .badge:empty {
                display: none;
            }

            .toolbar {
                position: sticky;
                top: 0;
                z-index: 1;
                display: flex;
                padding-bottom: 6px;
                background: var(--bg);
            }
            .link-btn {
                margin-left: auto;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 12px;
                cursor: pointer;
                padding: 2px 6px;
                border-radius: 6px;
            }
            .link-btn:hover {
                background: var(--surface);
                color: var(--fg);
            }
            .link-btn.armed {
                color: var(--err);
            }

            .list {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .empty {
                color: var(--muted);
                padding: 10px 12px;
                border-radius: 12px;
                background: var(--surface);
            }
            .item {
                padding: 8px 12px;
                border-radius: 12px;
                background: var(--surface);
                border: 1px solid var(--line);
            }
            .item .t {
                font-weight: 500;
                word-break: break-word;
            }
            .item .m {
                color: var(--muted);
                font-size: 12px;
            }
            .item.ok {
                border-left: 3px solid var(--ok);
            }
            .item.err {
                border-left: 3px solid var(--err);
            }
            .item.err .t {
                color: var(--err);
                font:
                    12px/1.5 ui-monospace,
                    Consolas,
                    monospace;
                white-space: pre-wrap;
            }

            .actions {
                display: flex;
                gap: 8px;
            }
            button.btn {
                flex: 1;
                padding: 8px 12px;
                border-radius: 999px;
                cursor: pointer;
                border: 1px solid var(--line);
                background: transparent;
                color: var(--primary);
                font: inherit;
                font-weight: 500;
            }
            button.btn:hover {
                background: var(--surface);
            }
            a.coffee {
                flex: 1;
                display: block;
                text-align: center;
                text-decoration: none;
                padding: 8px 12px;
                border-radius: 999px;
                background: var(--coffee);
                color: var(--coffee-fg);
                font-weight: 600;
            }
            a.coffee:hover {
                filter: brightness(0.95);
            }
            footer {
                text-align: center;
                color: var(--muted);
                font-size: 12px;
            }
            footer a {
                color: var(--primary);
                text-decoration: none;
            }
            footer a:hover {
                text-decoration: underline;
            }
            button:focus-visible,
            a:focus-visible {
                outline: 2px solid var(--primary);
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>GPhotos Sorter</h1>
            <span class="pill" id="version"></span>
        </header>

        <label class="setting" title="Bật: tự tải lại trang khi sắp xếp xong. Tắt: giữ nguyên trang, bạn tự bấm nút “Tải lại trang” trên panel khi cần.">
            <span class="setting-text">Tự động tải lại trang sau khi sắp xếp</span>
            <input type="checkbox" id="auto-reload" role="switch" />
            <span class="sw" aria-hidden="true"></span>
        </label>

        <div class="tabs" role="tablist" aria-label="Album đã sắp xếp và lỗi">
            <button class="tab" id="tab-history" role="tab" type="button" aria-controls="panel-history" aria-selected="true">Album đã sắp xếp <span class="badge" id="history-count"></span></button>
            <button class="tab" id="tab-errors" role="tab" type="button" aria-controls="panel-errors" aria-selected="false" tabindex="-1">Lỗi <span class="badge err" id="errors-count"></span></button>
        </div>

        <main>
            <section id="panel-history" role="tabpanel" aria-labelledby="tab-history">
                <div class="toolbar" id="history-tools"><button class="link-btn" id="clear-history" type="button">Xóa</button></div>
                <div class="list" id="history"></div>
            </section>

            <section id="panel-errors" role="tabpanel" aria-labelledby="tab-errors" hidden>
                <div class="toolbar" id="errors-tools"><button class="link-btn" id="clear-errors" type="button">Xóa</button></div>
                <div class="list" id="errors"></div>
            </section>
        </main>

        <div class="actions">
            <button class="btn" id="report" type="button">Báo lỗi</button>
            <a class="coffee" id="coffee" target="_blank" rel="noopener noreferrer">☕ Buy me a coffee</a>
        </div>
        <footer>Phát triển bởi <a id="dev" target="_blank" rel="noopener noreferrer"></a></footer>

        <script src="lib/Store.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
